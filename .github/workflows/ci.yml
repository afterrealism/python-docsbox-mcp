name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: |
          uv venv
          uv pip install -e '.[dev]'
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: |
          uv venv
          uv pip install -e '.[dev]'
      - name: Pyright
        run: uv run pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e '.[dev]'
      - name: Pytest
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t python-docsbox-mcp:ci .
      - name: Smoke test container
        run: |
          docker run -d --name pdocs -p 7811:7811 python-docsbox-mcp:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:7811/health; then exit 0; fi
            sleep 1
          done
          docker logs pdocs
          exit 1
